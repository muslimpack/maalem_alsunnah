name: maalem_alsunnah
description: "A new Flutter project."
publish_to: 'none'

version: 0.2.01+3

environment:
  sdk: ^3.6.0
  flutter: "3.27.1"

dependencies:
  auto_size_text: ^3.0.0
  bloc: ^9.1.0
  bot_toast: ^4.1.3
  capture_widget:
    path: packages/capture_widget
  cupertino_icons: ^1.0.8
  easy_debounce: ^2.0.3
  equatable: ^2.0.7
  file_picker: ^10.3.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_breadcrumb: ^1.0.1
  flutter_colorpicker: ^1.1.0
  flutter_localizations:
    sdk: flutter
  fluttertoast: ^9.0.0
  get_it: ^8.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  infinite_scroll_pagination: ^4.0.0
  intl: ^0.20.2
  material_design_icons_flutter: ^7.0.7296
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^12.0.0
  skeletonizer: ^2.1.0+1
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  url_launcher: ^6.3.2
  window_manager: ^0.5.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  lint: ^2.8.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/db/
    - assets/fonts/

  fonts:
    - family: kitab
      fonts:
        - asset: assets/fonts/Kitab-Regular.ttf
        - asset: assets/fonts/Kitab-Bold.ttf
          weight: 700
    - family: hafs
      fonts:
        - asset: assets/fonts/Hafs-Regular.otf
    - family: adwaa
      fonts:
        - asset: assets/fonts/adwaa-alsalaf-regular.ttf
        - asset: assets/fonts/adwaa-alsalaf-bold.ttf
          weight: 700

flutter_intl:
  enabled: true
